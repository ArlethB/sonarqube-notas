# Analiza el proyecto con Pylint y SonarQube Cloud cada vez que se sube un cambio a main.
name: SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Analisis de calidad
    runs-on: ubuntu-latest
    steps:
      # Source: descarga el codigo. SonarQube usa el historial para reconocer el codigo nuevo.
      - name: Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Build: prepara Python y comprueba que el programa no tenga errores de sintaxis.
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install pylint==4.1.3
          python -m py_compile notas.py

      # Pylint: revisa el codigo y guarda el resultado para que SonarQube lo importe.
      - name: Pylint
        run: |
          pylint notas.py --exit-zero -r n --output-format=parseable --msg-template="{path}:{line}: [{msg_id}({symbol}), {obj}] {msg}" > pylint-report.txt

      # SonarQube: envia el codigo y el reporte a SonarQube Cloud.
      - name: SonarQube
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
